program: cs336_basics/train.py
name: layer_norm_ablation
method: grid
metric:
  goal: minimize
  name: valid/loss
parameters:
  learning_rate:
    values:
      - !!float 1e-3
      - !!float 3e-4
      - !!float 1e-4
command:
  - ${env}
  - ./.venv/bin/python
  - -m
  - cs336_basics.train
  - --run-name=layer-norm-ablation
  - --experiment-name=layer_norm_ablation
  - --wandb-project=cs336-basics
  - --wandb-group=layer-norm-ablation
  - --wandb-tag=tinystories
  - --wandb-tag=rmsnorm_ablation
  - --wandb-tag=no_norm
  - --tokenized-train-data-path=data/TinyStoriesV2-GPT4-train.npy
  - --tokenized-valid-data-path=data/TinyStoriesV2-GPT4-valid.npy
  - --tokenizer-vocab-path=assets/tokenizer/gpt2_vocab.json
  - --tokenizer-merges-path=assets/tokenizer/gpt2_merges.txt
  - --checkpoint-path=checkpoints/layer-norm-ablation.pt
  - --vocab-size=50257
  - --context-length=128
  - --d-model=128
  - --num-layers=4
  - --num-heads=4
  - --d-ff=384
  - --batch-size=32
  - --max-iters=1000
  - --warmup-iters=100
  - --cosine-cycle-iters=1000
  - --min-learning-rate=1e-5
  - --log-every=10
  - --eval-every=100
  - --sample-every=1000000
  - --save-every=1000000
  - --device=mps
  - --use-wandb
  - --norm-type=none
